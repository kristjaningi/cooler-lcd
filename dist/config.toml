# cooler-lcd config. Copy to ~/.config/cooler-lcd/config.toml.
# Every setting is optional; these are the defaults.

# Screens to show, in order. Available: dashboard, usage, radar
screens = ["dashboard"]

# Screens from the list above that start switched off: skipped by the
# rotation until `cooler-lcd on NAME` (or `toggle NAME`).
off = []

# Seconds each screen stays up when more than one is listed.
rotate_seconds = 15

# A bar along the bottom edge that fills up as the next screen draws near.
rotate_bar = true

[radar]
# Compass bearing at the top of the scope: the direction you face looking
# at the panel, so traffic on the screen's right is off to your right.
heading = 0

# Latitude and longitude at the middle of the scope; between Keflavik and
# Reykjavik when unset. Stays on this machine: the feed is only asked
# about a spot rounded to 0.1 degrees.
# center = [64.05, -22.25]
