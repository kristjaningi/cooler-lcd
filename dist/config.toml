# cooler-lcd config. Copy to ~/.config/cooler-lcd/config.toml.
# Every setting is optional; these are the defaults.

# Screens to show, in order. Available: dashboard, usage, radar, music
# (music is skipped while nothing is playing)
screens = ["dashboard"]

# Screens from the list above that start switched off: skipped by the
# rotation until `cooler-lcd on NAME` (or `toggle NAME`).
off = []

# Seconds each screen stays up when more than one is listed.
rotate_seconds = 15

# A bar along the bottom edge that fills up as the next screen draws near.
rotate_bar = true

[radar]
# Compass bearing at the top of the scope: the direction you face looking
# at the panel, so traffic on the screen's right is off to your right.
heading = 0

# Latitude and longitude at the middle of the scope; between Keflavik and
# Reykjavik when unset. Stays on this machine: the feed is only asked
# about a spot rounded to 0.1 degrees.
# center = [64.05, -22.25]

[night]
# When the panel dims, so it doesn't glow across a dark room: hours on the
# local clock (across midnight if the second comes first), "sunset" (from
# sunset to sunrise at the radar's center above, which far north is most
# of a winter's day), or "never". `cooler-lcd night on|off` overrides it
# until it next changes; `cooler-lcd night auto` hands back to it.
schedule = "22:00-07:00"

# What the brightest colors keep of their brightness at night, 0.2 to 1.
# Darker colors sink further, so backgrounds go nearly black while text
# stays readable.
brightness = 0.6
