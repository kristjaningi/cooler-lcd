[package]
name = "cooler-lcd"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
chrono = "0.4"
jpeg-encoder = { version = "0.7", features = ["simd"] }
nusb = "0.2"
nvml-wrapper = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.12"
toml = "1"
ureq = "3"

# A panic in any worker thread (USB sender, control socket, desktop or radar
# feed) would otherwise leave the process running but broken, out of reach of
# the unit's Restart=always. Aborting lets systemd start it fresh.
[profile.release]
panic = "abort"
